<!DOCTYPE html>
<html>

<head>
  <title>Uuden lautapelin luominen</title>
</head>

<body>
  <h1>Uusi lautapeli</h1>
  <form action="/create_boardgame" method="post">
    <p>
        Lautapelin nimi: <br />
        <input type="text" name="boardgame_name" />
    </p>
    <p>
        Lautapelin kesto: <br /> 
        <input type="text" name="duration" /> min
    </p>
    <p>
        Lautapelin minimipelaajamäärä: <br />
        <input type="text" name="players_min" />
    </p>
    <p>
        Lautapelin maksimipelaajamäärä: <br />
        <input type="text" name="players_max" />
    </p>
    <p>
        Lautapelin ikäraja: <br />
        <input type="text" name="age_limit" />
    </p>
    <p>
        Lautapelin genre: <br />
        <input type="text" name="genre" />
    </p>
    <input type="submit" value="Luo uusi lautapeli" />
  </form>
</body>

</html>
