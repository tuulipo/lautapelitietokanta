<!DOCTYPE html>
<html>

<head>
    <title>Uuden lautapelin lisääminen</title>
</head>

<body>
    <h1>Uusi lautapeli</h1>

    <form action="/create_boardgame" method="post">
        <p>
            <input type="hidden" name="csrf_token"
            value="{{ session.csrf_token }}">
        </p>
        <p>
            Pelin nimi:
            <input type="text" name="boardgame_name" required>
        </p>
        <p>
            Pelin kesto:
            <input type="text" name="duration">
        </p>
        <p>
            Minimipelaajamäärä:
            <input type="text" name="players_min">
        </p>
        <p>
            Maksimipelaajamäärä:
            <input type="text" name="players_max">
        </p>
        <p>
            Ikäraja:
            <input type="text" name="age_limit">
        </p>
        <p>
            Pelityyppi:
            <input type="text" name="genre">
        </p>
        <input type="submit" value="Lisää lautapeli">
    </form>

    <a href="/">Takaisin etusivulle</a>
</body>

</html>
